<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Labkom - Jurnal Lab Komputer</title>
  
  <!-- Favicon Logo SMAN 1 Banda Aceh -->
  <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBxQaozyW8IoT_FkoQcMUtn0vPLJHuTzAwrvuasqhbpQ&s=10">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Import Firebase + Auth -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  
  <!-- Import SheetJS untuk Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Import EmailJS Browser SDK (Pengganti WA) -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-slate-50">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyDfePsFQwgGqnZ5CCJ87iaaGEKwr0VYsJQ",
      authDomain: "jurnallabkom.firebaseapp.com",
      projectId: "jurnallabkom",
      storageBucket: "jurnallabkom.firebasestorage.app",
      messagingSenderId: "473470277683",
      appId: "1:473470277683:web:1f57b8af9424a917802b46"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // --- 2. KONFIGURASI SISTEM & EMAILJS ---
    const ADMIN_EMAILS = [
      'iwandoumy18@guru.sma.belajar.id'
    ];

    const KEPALA_LAB_EMAILS = [
      'doumy@sman1bandaaceh.sch.id'
    ];

    // Konfigurasi EmailJS (Silakan ganti dengan Key EmailJS Anda sendiri jika diperlukan)
    const EMAILJS_PUBLIC_KEY = "uPvCKbKCtPhkHB0qN"; // Masukkan Public Key EmailJS
    const EMAILJS_SERVICE_ID = "service_11zu2vd"; // Masukkan Service ID EmailJS
    const EMAILJS_TEMPLATE_ID = "template_lg2hquj"; // Masukkan Template ID EmailJS

    function App() {
      const [user, setUser] = useState(null);
      const [role, setRole] = useState('guru'); 
      const [loadingAuth, setLoadingAuth] = useState(true);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [bookings, setBookings] = useState([]);
      const [journals, setJournals] = useState([]);
      const [inventory, setInventory] = useState([]);

      // State Pengajuan & Edit Pengajuan (Tanpa WA, menggunakan Email)
      const [newBooking, setNewBooking] = useState({ subject: '', date: '', timeStart: '', timeEnd: '', class: '', pcsNeeded: '', teacherName: '' });
      const [editingBookingId, setEditingBookingId] = useState(null); 
      
      const [newJournal, setNewJournal] = useState({ bookingId: '', attendees: '', issues: '', summary: '', materi: '', devices: [] });
      const [newItem, setNewItem] = useState({ kode: '', nama: '', kategori: 'PC', qtyBaik: 0, qtyRusakRingan: 0, qtyRusakBerat: 0 });
      const [editItemId, setEditItemId] = useState(null);
      const [editItemData, setEditItemData] = useState({ qtyBaik: 0, qtyRusakRingan: 0, qtyRusakBerat: 0 });

      // State Filter & Tampilan Jurnal
      const [filterTeacher, setFilterTeacher] = useState('');
      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');
      const [filterKeyword, setFilterKeyword] = useState('');
      const [journalViewMode, setJournalViewMode] = useState('auto'); // 'auto', 'table', 'card'

      const todayStrLocal = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
      const [timelineDate, setTimelineDate] = useState(todayStrLocal);
      const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());
      const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
      
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);

      const MONTH_NAMES = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const DAY_NAMES = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

      const prevMonth = () => {
        if (calendarMonth === 0) {
          setCalendarMonth(11);
          setCalendarYear(y => y - 1);
        } else {
          setCalendarMonth(m => m - 1);
        }
      };

      const nextMonth = () => {
        if (calendarMonth === 11) {
          setCalendarMonth(0);
          setCalendarYear(y => y + 1);
        } else {
          setCalendarMonth(m => m + 1);
        }
      };

      const goToCurrentMonth = () => {
        const now = new Date();
        setCalendarMonth(now.getMonth());
        setCalendarYear(now.getFullYear());
        setTimelineDate(todayStrLocal);
      };

      const formatDateIndo = (dateStr) => {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        const dayNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        return `${dayNames[dateObj.getDay()]}, ${d} ${MONTH_NAMES[m - 1]} ${y}`;
      };

      // Helper konversi waktu jam:menit ke menit
      const timeToMins = (t) => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; };

      // Logika Ketersediaan Jadwal & Deteksi Bentrok untuk Form Pengajuan
      const existingBookingsOnDate = bookings
        .filter(b => b.date === newBooking.date && b.status !== 'rejected' && b.status !== 'cancelled' && b.id !== editingBookingId)
        .sort((a, b) => timeToMins(a.timeStart) - timeToMins(b.timeStart));

      const newStartMins = timeToMins(newBooking.timeStart);
      const newEndMins = timeToMins(newBooking.timeEnd);

      const conflictingBookings = existingBookingsOnDate.filter(b => {
        if (!newBooking.timeStart || !newBooking.timeEnd) return false;
        const bStart = timeToMins(b.timeStart);
        const bEnd = timeToMins(b.timeEnd);
        return (newStartMins < bEnd && newEndMins > bStart);
      });

      const hasBookingConflict = conflictingBookings.length > 0;
      const isBookingTimeInvalid = Boolean(newBooking.timeStart && newBooking.timeEnd && newStartMins >= newEndMins);

      useEffect(() => {
        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            if (ADMIN_EMAILS.includes(currentUser.email)) {
              setRole('laboran');
            } else if (KEPALA_LAB_EMAILS.includes(currentUser.email)) {
              setRole('kepala_lab');
            } else {
              setRole('guru');
            }
            setNewBooking(prev => ({ ...prev, teacherName: currentUser.displayName || '' }));
          } else {
            setUser(null);
          }
          setLoadingAuth(false);
        });
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!user) return;

        const unsubBookings = db.collection('bookings')
          .orderBy('createdAt', 'desc')
          .onSnapshot((snapshot) => {
            setBookings(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });

        const unsubJournals = db.collection('journals')
          .orderBy('createdAt', 'desc')
          .onSnapshot((snapshot) => {
            setJournals(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
          
        const unsubInventory = db.collection('inventory')
          .orderBy('createdAt', 'desc')
          .onSnapshot((snapshot) => {
            setInventory(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });

        return () => {
          unsubBookings();
          unsubJournals();
          unsubInventory();
        };
      }, [user]);

      // --- FUNGSI PENGIRIM EMAIL UNIVERSAL (EMAILJS) ---
      const sendEmailNotif = async (toEmail, toName, subject, message) => {
        if (!EMAILJS_PUBLIC_KEY || EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
          console.log("EmailJS Belum Dikonfigurasi. Simulasi Kirim Email:", { toEmail, subject, message });
          return;
        }
        try {
          await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_email: toEmail,
            to_name: toName || 'Pengguna',
            subject_title: subject,
            message_body: message,
          }, EMAILJS_PUBLIC_KEY);
          console.log(`Email berhasil dikirim ke ${toEmail}`);
        } catch (error) {
          console.error("Gagal mengirim email via EmailJS:", error);
        }
      };

      const loginGoogle = () => { auth.signInWithPopup(googleProvider).catch((e) => alert(e.message)); };
      const logout = () => { auth.signOut(); };

      // --- AKSI LABORAN ---
      const handleApprove = async (id) => {
        if(role === 'kepala_lab') return; 
        const b = bookings.find(x => x.id === id);
        await db.collection('bookings').doc(id).update({ status: 'approved' });
        
        if (b && b.teacherEmail) {
          const pesan = `Yth. Bapak/Ibu ${b.teacher},\n\nPengajuan pemakaian Labkom Anda untuk kegiatan/mapel ${b.subject} (Kelas ${b.class}) pada tanggal ${b.date} jam ${b.timeStart} - ${b.timeEnd} telah DISETUJUI.\n\nTerima kasih.`;
          sendEmailNotif(b.teacherEmail, b.teacher, "Persetujuan Jadwal Labkom", pesan);
        }
      };

      const handleReject = async (id) => {
        if(role === 'kepala_lab') return;
        const b = bookings.find(x => x.id === id);
        await db.collection('bookings').doc(id).update({ status: 'rejected' });
        
        if (b && b.teacherEmail) {
          const pesan = `Yth. Bapak/Ibu ${b.teacher},\n\nMohon maaf, pengajuan pemakaian Labkom Anda untuk kegiatan/mapel ${b.subject} pada tanggal ${b.date} DITOLAK.\n\nSilakan cek portal Jurnal Labkom untuk mengajukan ulang slot waktu lain.`;
          sendEmailNotif(b.teacherEmail, b.teacher, "Status Pengajuan Labkom: DITOLAK", pesan);
        }
      };

      const handlePending = async (id) => {
        if(role === 'kepala_lab') return;
        await db.collection('bookings').doc(id).update({ status: 'pending' });
      };

      // --- AKSI GURU (PENGAJUAN, EDIT, BATAL) ---
      const submitBooking = async (e) => {
        e.preventDefault();
        if (isBookingTimeInvalid) {
          alert(`Jam selesai (${newBooking.timeEnd}) harus lebih akhir dari jam mulai (${newBooking.timeStart})!`);
          return;
        }
        if (hasBookingConflict) {
          const firstConflict = conflictingBookings[0];
          alert(`Jadwal bentrok dengan: ${firstConflict.teacher} (${firstConflict.timeStart} - ${firstConflict.timeEnd}, ${firstConflict.subject}). Silakan pilih slot waktu lain.`);
          return;
        }
        try {
          if (editingBookingId) {
            // Mode Update/Edit Jadwal
            await db.collection('bookings').doc(editingBookingId).update({
              ...newBooking,
              teacher: newBooking.teacherName || user.displayName || 'Guru',
              teacherEmail: user.email,
              status: 'pending'
            });
            
            const pesanLaboran = `Perubahan/Edit Pengajuan Lab!\n\nGuru: ${newBooking.teacherName || user.displayName} (${user.email})\nMapel: ${newBooking.subject}\nKelas: ${newBooking.class}\nTanggal: ${newBooking.date}\nWaktu: ${newBooking.timeStart} - ${newBooking.timeEnd}\n\nTelah diubah & diajukan ulang. Silakan cek portal Jurnal Labkom.`;
            ADMIN_EMAILS.forEach(emailLaboran => {
              sendEmailNotif(emailLaboran, "Laboran", "Perubahan Pengajuan Jadwal Labkom", pesanLaboran);
            });
            
            alert("Pengajuan berhasil diperbarui dan diajukan ulang!");
            setEditingBookingId(null);

          } else {
            // Mode Pengajuan Baru
            await db.collection('bookings').add({ 
              ...newBooking, 
              teacher: newBooking.teacherName || user.displayName || 'Guru', 
              teacherEmail: user.email, 
              status: 'pending', 
              createdAt: firebase.firestore.FieldValue.serverTimestamp() 
            });
            
            const pesanLaboran = `Pengajuan Pemakaian Labkom Baru!\n\nGuru: ${newBooking.teacherName || user.displayName} (${user.email})\nMapel: ${newBooking.subject}\nKelas: ${newBooking.class}\nTanggal: ${newBooking.date}\nWaktu: ${newBooking.timeStart} - ${newBooking.timeEnd}\n\nSilakan cek portal Jurnal Labkom untuk verifikasi.`;
            ADMIN_EMAILS.forEach(emailLaboran => {
              sendEmailNotif(emailLaboran, "Laboran", "Pengajuan Pemakaian Labkom Baru", pesanLaboran);
            });
            
            alert("Pengajuan berhasil dikirim! Menunggu persetujuan laboran.");
          }

          setNewBooking({ subject: '', date: '', timeStart: '', timeEnd: '', class: '', pcsNeeded: '', teacherName: user.displayName || '' });
          setActiveTab('riwayat-pengajuan');
        } catch (error) {
          alert("Gagal memproses pengajuan.");
        }
      };

      const handleEditBooking = (b) => {
        setEditingBookingId(b.id);
        setNewBooking({
          subject: b.subject,
          date: b.date,
          timeStart: b.timeStart,
          timeEnd: b.timeEnd,
          class: b.class,
          pcsNeeded: b.pcsNeeded,
          teacherName: b.teacherName || b.teacher || user.displayName || ''
        });
        setActiveTab('pengajuan');
      };

      const cancelEditBooking = () => {
        setEditingBookingId(null);
        setNewBooking({ subject: '', date: '', timeStart: '', timeEnd: '', class: '', pcsNeeded: '', teacherName: user.displayName || '' });
        setActiveTab('riwayat-pengajuan');
      };

      const handleCancelBooking = async (id) => {
        if (confirm("Apakah Anda yakin ingin MEMBATALKAN jadwal ini? Slot waktu akan dikosongkan.")) {
          try {
            await db.collection('bookings').doc(id).update({ status: 'cancelled' });
            
            const b = bookings.find(x => x.id === id);
            const pesanLaboran = `PEMBATALAN JADWAL LAB\n\nJadwal atas nama ${b.teacher} (${b.teacherEmail}) untuk mapel ${b.subject} pada tanggal ${b.date} telah DIBATALKAN oleh guru yang bersangkutan.`;
            ADMIN_EMAILS.forEach(emailLaboran => {
              sendEmailNotif(emailLaboran, "Laboran", "Pembatalan Jadwal Labkom", pesanLaboran);
            });
            
            alert("Jadwal berhasil dibatalkan.");
          } catch (error) {
            alert("Gagal membatalkan jadwal.");
          }
        }
      };

      // --- JURNAL ---
      const handleDeviceChange = (device) => {
        setNewJournal(prev => ({ ...prev, devices: prev.devices.includes(device) ? prev.devices.filter(d => d !== device) : [...prev.devices, device] }));
      };

      const submitJournal = async (e) => {
        e.preventDefault();
        const b = bookings.find(x => x.id === newJournal.bookingId);
        await db.collection('journals').add({ 
          ...newJournal, 
          date: new Date().toISOString().split('T')[0], 
          teacher: user.displayName || 'Guru', 
          subject: b ? b.subject : 'Umum', 
          createdAt: firebase.firestore.FieldValue.serverTimestamp() 
        });
        setNewJournal({ bookingId: '', attendees: '', issues: '', summary: '', materi: '', devices: [] });
        setActiveTab('laporan');
        alert("Jurnal disimpan!");
      };

      // --- INVENTARIS ---
      const submitItem = async (e) => {
        e.preventDefault();
        if(role !== 'laboran') return;
        await db.collection('inventory').add({
          ...newItem, 
          qtyBaik: Number(newItem.qtyBaik),
          qtyRusakRingan: Number(newItem.qtyRusakRingan),
          qtyRusakBerat: Number(newItem.qtyRusakBerat),
          createdAt: firebase.firestore.FieldValue.serverTimestamp() 
        });
        setNewItem({ kode: '', nama: '', kategori: 'PC', qtyBaik: 0, qtyRusakRingan: 0, qtyRusakBerat: 0 });
        alert("Kelompok Barang ditambahkan ke Inventaris!");
      };

      const saveEditItem = async (id) => {
        if(role !== 'laboran') return;
        await db.collection('inventory').doc(id).update({
          qtyBaik: Number(editItemData.qtyBaik),
          qtyRusakRingan: Number(editItemData.qtyRusakRingan),
          qtyRusakBerat: Number(editItemData.qtyRusakBerat)
        });
        setEditItemId(null);
      };

      const deleteItem = async (id) => {
        if(role !== 'laboran') return;
        if(confirm("Hapus kelompok barang ini dari inventaris?")) {
          await db.collection('inventory').doc(id).delete();
        }
      };

      // --- FILTER & PENCARIAN DATA JURNAL ---
      const uniqueTeachers = Array.from(new Set(journals.map(j => j.teacher).filter(Boolean)));

      const filteredJournals = journals.filter(j => {
        if (filterTeacher.trim() !== '') {
          const matchTeacher = (j.teacher || '').toLowerCase().includes(filterTeacher.toLowerCase().trim());
          if (!matchTeacher) return false;
        }
        if (filterStartDate) {
          if ((j.date || '') < filterStartDate) return false;
        }
        if (filterEndDate) {
          if ((j.date || '') > filterEndDate) return false;
        }
        if (filterKeyword.trim() !== '') {
          const kw = filterKeyword.toLowerCase().trim();
          const matchKw = (j.subject || '').toLowerCase().includes(kw) ||
                          (j.materi || '').toLowerCase().includes(kw) ||
                          (j.summary || '').toLowerCase().includes(kw) ||
                          (j.issues || '').toLowerCase().includes(kw);
          if (!matchKw) return false;
        }
        return true;
      });

      const resetJournalFilter = () => {
        setFilterTeacher('');
        setFilterStartDate('');
        setFilterEndDate('');
        setFilterKeyword('');
      };

      const isFilterActive = Boolean(filterTeacher.trim() || filterStartDate || filterEndDate || filterKeyword.trim());

      // --- FITUR EKSPOR DATA (EXCEL & CSV) ---
      const exportToExcel = () => {
        if (filteredJournals.length === 0) { 
          alert("Tidak ada data jurnal untuk diexport!"); 
          return; 
        }
        const dataToExport = filteredJournals.map((j, index) => ({
          'No': index + 1,
          'Tanggal': j.date,
          'Nama Guru': j.teacher,
          'Mata Pelajaran': j.subject,
          'Materi/Tema': j.materi || '-',
          'Perangkat Lab': j.devices ? (Array.isArray(j.devices) ? j.devices.join(', ') : j.devices) : '-',
          'Jml Kehadiran': j.attendees,
          'Ringkasan Kegiatan': j.summary,
          'Kendala Dilaporkan': j.issues || 'Aman'
        }));
        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data Jurnal");
        worksheet['!cols'] = [{wch: 5}, {wch: 12}, {wch: 25}, {wch: 20}, {wch: 30}, {wch: 25}, {wch: 15}, {wch: 40}, {wch: 30}];
        XLSX.writeFile(workbook, `Laporan_Labkom_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      const exportToCSV = () => {
        if (filteredJournals.length === 0) { 
          alert("Tidak ada data jurnal untuk diexport!"); 
          return; 
        }
        const dataToExport = filteredJournals.map((j, index) => ({
          'No': index + 1,
          'Tanggal': j.date,
          'Nama Guru': j.teacher,
          'Mata Pelajaran': j.subject,
          'Materi/Tema': j.materi || '-',
          'Perangkat Lab': j.devices ? (Array.isArray(j.devices) ? j.devices.join(', ') : j.devices) : '-',
          'Jml Kehadiran': j.attendees,
          'Ringkasan Kegiatan': j.summary,
          'Kendala Dilaporkan': j.issues || 'Aman'
        }));
        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const csvContent = XLSX.utils.sheet_to_csv(worksheet);

        // Menggunakan UTF-8 BOM (\uFEFF) agar simbol dan huruf terbaca sempurna di Excel
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Laporan_Labkom_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      // --- HELPER TIMELINE & DASHBOARD ---
      const timelineBookings = bookings.filter(b => b.date === timelineDate && b.status !== 'rejected' && b.status !== 'cancelled');

      // Logika Overdue (Lewat 1x24 jam belum isi jurnal)
      const overdueBookingsAll = bookings.filter(b => {
        if (b.status !== 'approved') return false;
        const hasJournal = journals.some(j => j.bookingId === b.id);
        if (hasJournal) return false;
        
        const endDateTime = new Date(`${b.date}T${b.timeEnd || '17:00'}`);
        const now = new Date();
        const diffHours = (now - endDateTime) / (1000 * 60 * 60);
        return diffHours >= 24;
      });
      const overdueGuru = overdueBookingsAll.filter(b => b.teacherEmail === user?.email);

      // --- PENGINGAT / TAGIHAN EMAIL 1x24 JAM ---
      const handleSendReminderEmail = (b) => {
        if(!b.teacherEmail) { alert("Email guru tidak ditemukan!"); return; }
        const pesan = `Yth. Bapak/Ibu ${b.teacher},\n\nPengingat Pengisian Jurnal Labkom:\nJadwal pemakaian Labkom Anda untuk mata pelajaran ${b.subject} kelas ${b.class} (Tanggal ${b.date}) telah berlalu lebih dari 1x24 Jam.\n\nMohon kesediaannya untuk segera mengisi jurnal melalui aplikasi Jurnal Labkom.\n\nTerima kasih.`;
        sendEmailNotif(b.teacherEmail, b.teacher, "Pengingat: Pengisian Jurnal Labkom (1x24 Jam)", pesan);
        alert("Email pengingat berhasil dikirim ke: " + b.teacherEmail);
      };

      const totalBaik = inventory.reduce((sum, item) => sum + (Number(item.qtyBaik) || 0), 0);
      const totalRusakRingan = inventory.reduce((sum, item) => sum + (Number(item.qtyRusakRingan) || 0), 0);
      const totalRusakBerat = inventory.reduce((sum, item) => sum + (Number(item.qtyRusakBerat) || 0), 0);
      const totalRusak = totalRusakRingan + totalRusakBerat;
      const totalAlat = totalBaik + totalRusak;

      const NavItem = ({ id, icon, label }) => (
        <button onClick={() => { setActiveTab(id); setIsSidebarOpen(false); }} className={`flex items-center space-x-3 px-4 py-3 w-full rounded-lg transition-colors text-left ${activeTab === id ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-blue-50'}`}>

                          const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;

                          const isToday = dateStr === todayStrLocal;
                          const hasApproved = dayBookings.some(b => b.status === 'approved');
                          const hasPending = dayBookings.some(b => b.status === 'pending');
                          const hasBookings = dayBookings.length > 0;

                          // Penentuan warna berdasarkan status
                          let colorStyle = "bg-white border-slate-200 text-slate-700 hover:border-blue-400";
                          if (hasBookings) {
                            if (hasApproved && !hasPending) {
                              colorStyle = "bg-emerald-100 text-emerald-950 border-emerald-300 hover:bg-emerald-200 shadow-xs";
                            } else if (hasPending && !hasApproved) {
                              colorStyle = "bg-amber-100 text-amber-950 border-amber-300 hover:bg-amber-200 shadow-xs";
                            } else {
                              colorStyle = "bg-gradient-to-br from-emerald-100 to-amber-100 text-slate-900 border-emerald-400 hover:from-emerald-200 hover:to-amber-200 shadow-xs";
                            }
                          }

                          return (
                            <button
                              key={dateStr}
                              onClick={() => setTimelineDate(dateStr)}

                                isSelected ? 'ring-2 ring-blue-600 ring-offset-2 z-10 shadow-md font-bold' : ''
                              }`}
                              title={`${dateStr}: ${hasBookings ? dayBookings.length + ' sesi pemakaian (Klik untuk rincian)' : 'Kosong'}`}

                                  }`}>
                                    <i className={`fas fa-${b.status === 'approved' ? 'check-circle' : 'clock'} mr-1 text-[9px]`}></i>

                                    const left = ((m - 450) / 630) * 100;
                                    const isHour = m % 60 === 0;
                                    if (m === 450) return null;
                                    return (
                                      <div key={m} className={`absolute top-0 bottom-0 border-l ${isHour ? 'border-slate-300' : 'border-slate-300 border-dashed opacity-50'} z-0`} style={{ left: `${Math.max(0, left)}%` }}>
                                        <span className={`text-[10px] ${isHour ? 'text-slate-500 font-bold' : 'text-slate-400 font-medium'} ml-1 mt-1 block`}>{Math.floor(m/60)}:{isHour ? '00' : '30'}</span>

                      </form>

                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">

                    <div className="p-3 bg-blue-50 border border-blue-100 rounded-lg text-xs text-blue-700 flex items-center">
                      <i className="fas fa-info-circle text-base mr-2"></i>
                      <span>Notifikasi status pengajuan akan dikirim otomatis ke email Anda: <strong>{user.email}</strong></span>
                    </div>

                    <button 
                      type="submit" 
                      disabled={hasBookingConflict || isBookingTimeInvalid}
                      className={`w-full font-semibold py-3 rounded-xl mt-4 transition-colors shadow-sm flex items-center justify-center space-x-2 ${
                        hasBookingConflict || isBookingTimeInvalid 
                          ? 'bg-slate-300 text-slate-500 cursor-not-allowed' 
                          : 'bg-blue-600 hover:bg-blue-700 text-white'
                      }`}
                    >
                      <i className={`fas ${editingBookingId ? 'fa-save' : 'fa-paper-plane'}`}></i>
                      <span>{editingBookingId ? 'Simpan Perubahan & Ajukan' : 'Kirim Pengajuan'}</span>
                    </button>
                  </form>
                </div>
              )}

              {/* === RIWAYAT PENGAJUAN (GURU) === */}
              {activeTab === 'riwayat-pengajuan' && role === 'guru' && (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="p-5 border-b bg-slate-50">
                    <h3 className="font-semibold text-lg text-slate-800"><i className="fas fa-history text-blue-500 mr-2"></i>Riwayat Pengajuan Saya</h3>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse min-w-[600px]">
                      <thead><tr className="bg-slate-50 text-slate-500 text-sm border-b"><th className="p-4">Tgl & Waktu</th><th className="p-4">Mapel / Kelas</th><th className="p-4">Status</th><th className="p-4 text-right">Aksi</th></tr></thead>
                      <tbody>
                        {bookings.filter(b => b.teacherEmail === user.email).map(booking => (
                          <tr key={booking.id} className="border-b hover:bg-slate-50">
                            <td className="p-4"><div className="font-medium text-slate-800">{booking.date}</div><div className="text-xs text-slate-500">{booking.timeStart} - {booking.timeEnd}</div></td>
                            <td className="p-4">
                              <div className="font-medium text-slate-800">{booking.subject}</div>
                              <div className="text-xs text-slate-500">{booking.class} • {booking.pcsNeeded} PC</div>
                            </td>
                            <td className="p-4">
                              {booking.status === 'pending' && <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-bold">Menunggu ACC</span>}
                              {booking.status === 'approved' && <span className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Disetujui</span>}
                              {booking.status === 'rejected' && <span className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Ditolak</span>}
                              {booking.status === 'cancelled' && <span className="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-bold">Dibatalkan</span>}
                            </td>
                            <td className="p-4 text-right">
                              <div className="flex justify-end space-x-2">
                                {booking.status === 'rejected' && (
                                  <button onClick={() => handleEditBooking(booking)} className="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 text-xs font-bold transition-colors">
                                    <i className="fas fa-edit mr-1"></i> Edit & Ulang
                                  </button>
                                )}
                                {(booking.status === 'pending' || booking.status === 'approved') && (
                                  <button onClick={() => handleCancelBooking(booking.id)} className="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 text-xs font-bold transition-colors">
                                    <i className="fas fa-ban mr-1"></i> Batalkan
                                  </button>
                                )}
                              </div>
                            </td>
                          </tr>
                        ))}
                        {bookings.filter(b => b.teacherEmail === user.email).length === 0 && (
                          <tr><td colSpan="4" className="p-8 text-center text-slate-500">Anda belum memiliki riwayat pengajuan.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* === ISI JURNAL (GURU) === */}
              {activeTab === 'isi-jurnal' && role === 'guru' && (
                <div className="max-w-2xl mx-auto bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="p-5 border-b border-slate-200 bg-green-50"><h3 className="font-semibold text-lg text-green-800">Form Jurnal Pemakaian Lab</h3></div>
                  <form onSubmit={submitJournal} className="p-6 space-y-4">
                    <div><label className="block text-sm font-medium mb-1">Jadwal Anda (Disetujui)</label><select required className="w-full p-2.5 border rounded-lg bg-slate-50" value={newJournal.bookingId} onChange={e => setNewJournal({...newJournal, bookingId: e.target.value})}><option value="">-- Pilih Jadwal --</option>{bookings.filter(b => b.status === 'approved' && b.teacherEmail === user.email).map(b => (<option key={b.id} value={b.id}>{b.date} | {b.subject}</option>))}</select></div>
                    <div><label className="block text-sm font-medium mb-1">Materi / Tema</label><input type="text" required placeholder="Materi diajarkan..." className="w-full p-2.5 border rounded-lg bg-slate-50" value={newJournal.materi} onChange={e => setNewJournal({...newJournal, materi: e.target.value})} /></div>
                    <div>
                      <label className="block text-sm font-medium mb-2">Perangkat Digunakan</label>
                      <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-lg border">
                        {['PC', 'Proyektor', 'Smartboard', 'Laptop'].map(dev => (
                          <label key={dev} className="flex items-center space-x-2"><input type="checkbox" checked={newJournal.devices.includes(dev)} onChange={() => handleDeviceChange(dev)} /><span>{dev}</span></label>
                        ))}
                      </div>
                    </div>
                    <div><label className="block text-sm font-medium mb-1">Jml Siswa Hadir</label><input type="number" required className="w-full p-2.5 border rounded-lg bg-slate-50" value={newJournal.attendees} onChange={e => setNewJournal({...newJournal, attendees: e.target.value})} /></div>
                    <div><label className="block text-sm font-medium mb-1">Ringkasan Kegiatan</label><textarea required rows="2" className="w-full p-2.5 border rounded-lg bg-slate-50" value={newJournal.summary} onChange={e => setNewJournal({...newJournal, summary: e.target.value})}></textarea></div>
                    <div><label className="block text-sm font-medium mb-1">Kendala Alat (Opsional)</label><textarea rows="2" placeholder="Cth: PC-05 Mouse rusak" className="w-full p-2.5 border rounded-lg bg-slate-50" value={newJournal.issues} onChange={e => setNewJournal({...newJournal, issues: e.target.value})}></textarea></div>
                    <button type="submit" className="w-full bg-green-600 text-white font-semibold py-3 rounded-xl mt-4">Simpan Jurnal</button>
                  </form>
                </div>
              )}

              {/* === PERSETUJUAN (LABORAN) === */}
              {activeTab === 'persetujuan' && role === 'laboran' && (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="p-5 border-b bg-slate-50"><h3 className="font-semibold text-lg">Manajemen Pengajuan</h3></div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse min-w-[600px]">
                      <thead><tr className="bg-slate-50 text-slate-500 text-sm border-b"><th className="p-4">Tgl & Waktu</th><th className="p-4">Guru / Mapel</th><th className="p-4">Status</th><th className="p-4 text-right">Aksi</th></tr></thead>
                      <tbody>
                        {bookings.map(booking => (
                          <tr key={booking.id} className="border-b hover:bg-slate-50">
                            <td className="p-4"><div className="font-medium text-slate-800">{booking.date}</div><div className="text-xs text-slate-500">{booking.timeStart} - {booking.timeEnd}</div></td>
                            <td className="p-4">
                              <div className="font-medium text-slate-800">{booking.teacher}</div>
                              <div className="text-xs text-slate-500">{booking.subject}</div>
                              <div className="text-[10px] text-slate-400 mt-0.5" title="Email Akun Google">{booking.teacherEmail}</div>
                            </td>
                            <td className="p-4">
                              {booking.status === 'pending' && <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-bold">Menunggu</span>}
                              {booking.status === 'approved' && <span className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Disetujui</span>}
                              {booking.status === 'rejected' && <span className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Ditolak</span>}
                              {booking.status === 'cancelled' && <span className="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-bold">Dibatalkan Guru</span>}
                            </td>
                            <td className="p-4 text-right">
                              <div className="flex justify-end space-x-2">
                                {booking.status !== 'approved' && booking.status !== 'cancelled' && <button onClick={() => handleApprove(booking.id)} className="p-2 bg-green-50 text-green-600 rounded-lg" title="Setujui"><i className="fas fa-check"></i></button>}
                                {booking.status !== 'rejected' && booking.status !== 'cancelled' && <button onClick={() => handleReject(booking.id)} className="p-2 bg-red-50 text-red-600 rounded-lg" title="Tolak"><i className="fas fa-times"></i></button>}
                                {booking.status !== 'pending' && booking.status !== 'cancelled' && <button onClick={() => handlePending(booking.id)} className="p-2 bg-slate-50 border text-slate-600 rounded-lg" title="Kembalikan ke Pending"><i className="fas fa-undo"></i></button>}
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
              
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
